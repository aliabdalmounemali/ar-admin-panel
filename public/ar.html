<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>تطبيق الواقع المعزز (AR)</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; background-color: #000; color: white; font-family: sans-serif; }
      #loading {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.9); z-index: 9999; cursor: pointer;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.2); border-radius: 50%;
        border-top: 4px solid #007bff; width: 50px; height: 50px;
        animation: spin 1s linear infinite; margin-bottom: 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #loading-text { font-size: 18px; text-align: center; padding: 0 20px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <!-- شاشة التحميل (مضاف لها ميزة الاختفاء عند الضغط) -->
    <div id="loading" onclick="this.style.display='none'">
      <div class="spinner"></div>
      <div id="loading-text">جاري تهيئة الكاميرا وتحميل المجسمات...<br><small>(اضغط هنا لإخفاء هذه الشاشة)</small></div>
    </div>

    <script>
      const API_URL = "https://ar-app-backend-production-3c06.up.railway.app";
      
      async function initAR() {
        try {
          const res = await fetch(API_URL + "/api/targets");
          const targets = await res.json();
          
          if (!targets || targets.length === 0) {
            document.getElementById('loading-text').innerText = "لا توجد أي مجسمات مسجلة حالياً! قم برفعها من لوحة التحكم.";
            document.querySelector('.spinner').style.display = 'none';
            return;
          }

          const scene = document.createElement('a-scene');
          scene.setAttribute('mindar-image', `imageTargetSrc: ${API_URL}/uploads/targets.mind; filterMinCF:0.0001; filterBeta: 0.001;`);
          scene.setAttribute('color-space', 'sRGB');
          scene.setAttribute('renderer', 'colorManagement: true, physicallyCorrectLights');
          scene.setAttribute('vr-mode-ui', 'enabled: false');
          scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
          
          const assets = document.createElement('a-assets');
          targets.forEach(t => {
            const assetItem = document.createElement('a-asset-item');
            assetItem.setAttribute('id', 'model-' + t.index);
            assetItem.setAttribute('src', API_URL + t.modelUrl);
            assets.appendChild(assetItem);
          });
          scene.appendChild(assets);

          const camera = document.createElement('a-camera');
          camera.setAttribute('position', '0 0 0');
          camera.setAttribute('look-controls', 'enabled: false');
          scene.appendChild(camera);

          targets.forEach(t => {
            const entity = document.createElement('a-entity');
            entity.setAttribute('mindar-image-target', 'targetIndex: ' + t.index);
            
            const model = document.createElement('a-gltf-model');
            model.setAttribute('src', '#model-' + t.index);
            // إعدادات الحجم المبدئي
            model.setAttribute('scale', '0.5 0.5 0.5'); 
            model.setAttribute('position', '0 0 0');
            model.setAttribute('rotation', '0 0 0');
            model.setAttribute('animation-mixer', ''); 
            
            entity.appendChild(model);
            scene.appendChild(entity);
          });

          // إضافة حدث الإخفاء قبل تشغيل المشهد لضمان عمله
          scene.addEventListener('arReady', () => {
             document.getElementById('loading').style.display = 'none';
          });
          scene.addEventListener('loaded', () => {
             document.getElementById('loading').style.display = 'none';
          });
          scene.addEventListener('arError', () => {
             document.getElementById('loading-text').innerHTML = "فشل في تشغيل الكاميرا! <br> تأكد من إعطاء صلاحية الكاميرا للمتصفح.";
             document.querySelector('.spinner').style.display = 'none';
          });

          document.body.appendChild(scene);

          // إخفاء إجباري كحد أقصى بعد 6 ثواني لضمان عدم تعليق الشاشة
          setTimeout(() => {
            const loader = document.getElementById('loading');
            if(loader) loader.style.display = 'none';
          }, 6000);

        } catch (err) {
          console.error(err);
          document.getElementById('loading-text').innerText = "حدث خطأ أثناء الاتصال بالسيرفر.";
          document.querySelector('.spinner').style.display = 'none';
        }
      }

      initAR();
    </script>
  </body>
</html>
